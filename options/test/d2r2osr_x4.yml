name: d2r2osr_x4
model_type: D2R2OSRModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

tile: # use the tile mode for limited GPU memory when testing.
  tile_size: 1024 # the higher, the more utilized GPU memory and the less performance change against the full image. must be an integer multiple of the window size.
  tile_pad: 16 # overlapping between adjacency patches.must be an integer multiple of the window size.

datasets:
  test_1:  # the 1st test dataset
    name: odisr_test
    type: RealESRGANODISRDataset
    dataroot_gt: datasets/test/odisr/HR
    dataroot_lq: datasets/test/odisr/LR_second_ECCV
    io_backend:
      type: disk
    condition_type: cos_latitude
    mode: 'test'
    gt_h: 1024
    gt_w: 2048

# network structures
network_g:
  type: D2R2OSR
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 16
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  c_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  condition_dim: 1
  vit_condition:  [6, 6, 6, 6, 6, 6]
  vit_condition_type: '3conv'
  window_condition: true
  dcn_condition: [1, 1, 1, 1, 1, 1, 1]
  dcn_condition_type: '2conv'
  mode: 'test'


# path
path:
  pretrain_network_g: pretrained/d2r2osr_x4.pth
  strict_load_g: true
  param_key_g: 'params_ema'

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name